# ==============================================================================
# mpv Configuration for Windows - Out-of-the-Box Ambient Mode
# Project: https://github.com/kmsrepo/mpv-ambient-windows
# ==============================================================================

# --- Video Output Configuration ---
# Use gpu-next (required for native GPU border blur in modern mpv)
vo=gpu-next
gpu-api=auto
hwdec=auto-safe

# --- Native Ambient Border Blur (Requires vo=gpu-next, mpv >= 0.38) ---
# Automatically fills side pillarbox & letterbox bars with a blurred video duplicate
border-background=blur
background-blur-radius=25

# --- Recursive Folder & Playlist Looping ---
# Recursively scans any folder or subfolder for videos and loops indefinitely
directory-mode=recursive
directory-filter-types=video
loop-playlist=inf

# --- Window & UX ---
keep-open=no
autofit-larger=90%x90%
force-window=immediate

# ==============================================================================
# Conditional Profile: FFmpeg lavfi Filter Fallback
# ==============================================================================
# If your mpv build does not support vo=gpu-next or if you prefer software-rendered
# ambient background with custom dimming/shadowing, uncomment the lines below:
#
# [vertical-ambient-filter]
# profile-cond=p["video-params/w"] and p["video-params/h"] and (p["video-params/w"] < p["video-params/h"])
# profile-desc="FFmpeg lavfi ambient blur fallback"
# vf-add="lavfi=[split[fg][bg];[bg]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,boxblur=25:5,eq=brightness=-0.08[bgblur];[fg]scale=-1:1080[fgscaled];[bgblur][fgscaled]overlay=(W-w)/2:(H-h)/2]"
